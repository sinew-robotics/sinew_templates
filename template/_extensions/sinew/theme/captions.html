<script>
(function () {
  function boldFloatIdentifiers() {
    document.querySelectorAll("figcaption.quarto-float-caption").forEach(function (caption) {
      if (caption.querySelector(".sinew-caption-identifier")) return;

      var textNode = Array.from(caption.childNodes).find(function (node) {
        return node.nodeType === Node.TEXT_NODE && /\S/.test(node.nodeValue || "");
      });
      if (!textNode) return;

      var match = textNode.nodeValue.match(/^(\s*)(Figure|Table)\s+([0-9]+(?:\.[0-9]+)*):\s*/);
      if (!match) return;

      var identifier = document.createElement("strong");
      identifier.className = "sinew-caption-identifier";
      identifier.textContent = match[2] + " " + match[3];

      caption.insertBefore(document.createTextNode(match[1]), textNode);
      caption.insertBefore(identifier, textNode);
      caption.insertBefore(document.createTextNode(": " + textNode.nodeValue.slice(match[0].length)), textNode);
      textNode.remove();
    });
  }

  function labelMissingEvidence() {
    document.querySelectorAll(".missing-evidence").forEach(function (block) {
      if (block.querySelector(".missing-evidence-label")) return;
      var label = document.createElement("p");
      label.className = "missing-evidence-label";
      label.textContent = "Missing evidence";
      block.insertBefore(label, block.firstChild);
    });
  }

  function installInstitutionLockups() {
    var slides = document.querySelectorAll(".reveal .slides section.slide");
    var source = document.querySelector(".reveal .slides section.slide .institution-lockup");
    if (!source) return;

    slides.forEach(function (slide) {
      var hasDirectLockup = Array.from(slide.children).some(function (child) {
        return child.classList && child.classList.contains("institution-lockup");
      });
      if (hasDirectLockup) return;

      var lockup = source.cloneNode(true);
      lockup.classList.add("institution-lockup-auto");
      lockup.setAttribute("aria-hidden", "true");
      lockup.querySelectorAll("img").forEach(function (image) {
        image.setAttribute("alt", "");
      });
      slide.appendChild(lockup);
    });
  }

  function numberAlgorithmCaptions() {
    document.querySelectorAll(".algorithm-caption").forEach(function (caption, index) {
      var identifier = caption.querySelector("strong");
      if (!identifier) return;

      identifier.className = "sinew-caption-identifier";
      identifier.textContent = "Algorithm " + (index + 1);

      var suffix = identifier.nextSibling;
      if (suffix && suffix.nodeType === Node.TEXT_NODE && !/^\s*:/.test(suffix.nodeValue || "")) {
        suffix.nodeValue = ": " + (suffix.nodeValue || "").replace(/^\s+/, "");
      }
    });
  }

  /* ---------------------------------------------------------------- */
  /* Video component (E3, sinew-6lb.2 / sinew-6lb.5)                   */
  /*                                                                    */
  /* Authors write a plain <video> inside a Quarto figure div (see the  */
  /* E2 authoring pattern in template/docs/figures-and-tables.md) with  */
  /* whatever combination of muted/playsinline/loop/controls/poster     */
  /* attributes the defaults call for. This runtime owns exactly three  */
  /* things HTML attributes cannot express on their own: (1) starting   */
  /* playback when Reveal actually shows the slide and stopping it when */
  /* the slide is left, instead of the browser's native autoplay firing */
  /* the instant the page loads, which finishes an unreached slide's    */
  /* clip before the audience ever sees it; (2) an optional trim window */
  /* (data-sinew-start / data-sinew-end, seconds, both optional and      */
  /* independent) that loops playback between two points without         */
  /* cutting the source file, so the never-trim-the-file rule stays      */
  /* practical for an excerpt; (3) the same trim/state handling replayed */
  /* inside the fullscreen evidence inspector's clone (see below), so a  */
  /* zoomed clip keeps the same window and does not restart or diverge   */
  /* from the video the audience was already watching on the slide.      */
  /*                                                                     */
  /* data-sinew-autoplay="false" opts a video out of enter-triggered      */
  /* playback (manual start via its own visible controls instead).       */
  /* Unmuted ("sound on") playback is an author choice made by omitting  */
  /* the muted attribute; this runtime never adds or removes it. Browsers*/
  /* block unmuted autoplay outside a user gesture, so an unmuted video   */
  /* entered via Reveal navigation (not a click) will usually stay        */
  /* paused with its controls visible rather than throwing -- .play()'s   */
  /* rejection is caught and swallowed deliberately; see                  */
  /* template/docs/figures-and-tables.md for the author-facing warning.   */
  function videoTrimBounds(video) {
    var start = parseFloat(video.dataset.sinewStart || "");
    var end = parseFloat(video.dataset.sinewEnd || "");
    return {
      start: isNaN(start) ? 0 : Math.max(0, start),
      end: isNaN(end) ? null : end
    };
  }

  function attemptPlay(video) {
    var attempt = video.play();
    if (attempt && typeof attempt.catch === "function") {
      attempt.catch(function () {
        /* Autoplay blocked (commonly unmuted playback outside a user
           gesture). Leave the video paused with its own controls so the
           viewer can start it manually; this is expected, not an error. */
      });
    }
  }

  function wireVideoTrim(video) {
    if (video.dataset.sinewTrimWired === "true") return;
    video.dataset.sinewTrimWired = "true";
    video.addEventListener("timeupdate", function () {
      var bounds = videoTrimBounds(video);
      if (bounds.end !== null && video.currentTime >= bounds.end) {
        video.currentTime = bounds.start;
        if (video.dataset.sinewPlaying === "true" && video.paused) attemptPlay(video);
      }
    });
  }

  function enterVideoSlide(video) {
    wireVideoTrim(video);
    var bounds = videoTrimBounds(video);
    video.currentTime = bounds.start;
    if (video.dataset.sinewAutoplay === "false") return;
    video.dataset.sinewPlaying = "true";
    attemptPlay(video);
  }

  function leaveVideoSlide(video) {
    var bounds = videoTrimBounds(video);
    video.dataset.sinewPlaying = "false";
    video.pause();
    video.currentTime = bounds.start;
  }

  function manageVideoPlayback() {
    var videos = document.querySelectorAll(".reveal .slides section.slide video");
    if (!videos.length) return;

    videos.forEach(function (video) {
      wireVideoTrim(video);
      video.currentTime = videoTrimBounds(video).start;
    });

    function handleSlideChanged(event) {
      var previous = event && event.previousSlide;
      var current = event && event.currentSlide;
      if (previous) previous.querySelectorAll("video").forEach(leaveVideoSlide);
      if (current) current.querySelectorAll("video").forEach(enterVideoSlide);
    }

    if (!window.Reveal || typeof window.Reveal.on !== "function") return;
    window.Reveal.on("slidechanged", handleSlideChanged);
    window.Reveal.on("ready", function (event) {
      handleSlideChanged({ currentSlide: event && event.currentSlide, previousSlide: null });
    });
  }

  /* Fullscreen inspector clones every figure with cloneNode(), which
     copies DOM/attributes but not a <video>'s live playback state or its
     event listeners. Without this pairing the clone would restart at 0:00
     while the original silently kept playing underneath (or lost sync) --
     "continuing at the same timestamp is what a viewer expects" is the
     explicit sinew-6lb.1 contract for video zoom. mirrorVideoStateIntoClone
     hands playback to the clone (matching videos by document order, since
     a figure holds at most one) and pauses the original so only one copy
     is ever audible/decoding at a time; mirrorVideoStateFromClone hands it
     back on close so the slide's own video resumes where the zoomed view
     left off instead of jumping back to wherever it was when zoom opened. */
  function mirrorVideoStateIntoClone(sourceRoot, cloneRoot) {
    var originals = sourceRoot.querySelectorAll("video");
    var clones = cloneRoot.querySelectorAll("video");
    originals.forEach(function (original, index) {
      var clone = clones[index];
      if (!clone) return;
      wireVideoTrim(clone);
      clone.muted = original.muted;
      clone.volume = original.volume;
      clone.loop = original.loop;
      clone.currentTime = original.currentTime;
      var wasPlaying = !original.paused;
      original.pause();
      if (wasPlaying) {
        clone.dataset.sinewPlaying = "true";
        attemptPlay(clone);
      }
    });
  }

  function mirrorVideoStateFromClone(cloneRoot, sourceRoot) {
    var clones = cloneRoot.querySelectorAll("video");
    var originals = sourceRoot.querySelectorAll("video");
    clones.forEach(function (clone, index) {
      var original = originals[index];
      if (!original) return;
      var wasPlaying = !clone.paused;
      clone.pause();
      original.currentTime = clone.currentTime;
      if (wasPlaying) {
        original.dataset.sinewPlaying = "true";
        attemptPlay(original);
      }
    });
  }

  function buildStyleBibliographies() {
    var globalReferences = document.querySelector(".global-references-slide #refs");
    if (!globalReferences) return;

    document.querySelectorAll(".style-references[data-reference-keys]").forEach(function (container) {
      var keys = (container.dataset.referenceKeys || "").trim().split(/\s+/).filter(Boolean);
      var allowedKeys = new Set(keys);

      container.classList.add("references", "csl-bib-body", "hanging-indent");
      container.setAttribute("role", "list");
      container.replaceChildren();

      keys.forEach(function (key) {
        var source = document.getElementById("ref-" + key);
        if (!source) return;

        var entry = source.cloneNode(true);
        entry.removeAttribute("id");
        entry.dataset.referenceKey = key;
        entry.setAttribute("role", "listitem");
        container.appendChild(entry);
      });

      var referencesSlide = container.closest("section.slide");
      var stack = referencesSlide ? referencesSlide.parentElement : null;
      if (!referencesSlide || !referencesSlide.id || !stack) return;

      stack.querySelectorAll('a[role="doc-biblioref"]').forEach(function (link) {
        var citation = link.closest("[data-cites]");
        var citedKeys = citation ? (citation.dataset.cites || "").split(/\s+/) : [];
        if (citedKeys.some(function (key) { return allowedKeys.has(key); })) {
          link.setAttribute("href", "#/" + referencesSlide.id);
        }
      });
    });
  }

  function labelResearchStatements() {
    [
      [".research-questions", "Q"],
      [".research-hypotheses", "H"]
    ].forEach(function (definition) {
      document.querySelectorAll(definition[0]).forEach(function (list) {
        Array.from(list.children).filter(function (item) {
          return item.matches("li");
        }).forEach(function (item, index) {
          var identifier = definition[1] + (index + 1);
          var slide = item.closest("section.slide");
          var scope = slide && slide.dataset.stylePreview
            ? slide.dataset.stylePreview
            : "deck";
          item.dataset.sinewStatementId = identifier;
          item.dataset.sinewStatementKind = definition[1] === "Q" ? "question" : "hypothesis";
          if (!item.id) item.id = "research-" + scope + "-" + identifier.toLowerCase();
          item.setAttribute("aria-label", identifier + ": " + item.textContent.trim());
        });
      });
    });
  }

  function referenceStack(element) {
    var slide = element.closest("section.slide");
    return slide ? slide.parentElement : null;
  }

  function findAlgorithmCode(caption) {
    var code = caption ? caption.previousElementSibling : null;
    while (code && !code.matches(".sourceCode, .code-copy-outer-scaffold, pre")) {
      code = code.previousElementSibling;
    }
    return code;
  }

  function typesetClonedMath(scope) {
    if (!scope || !window.katex || typeof window.katex.render !== "function") return;
    scope.querySelectorAll(".math").forEach(function (element) {
      if (element.querySelector(".katex")) return;
      var source = element.textContent.trim();
      if (!source) return;
      window.katex.render(source, element, {
        displayMode: element.classList.contains("display"),
        throwOnError: false
      });
    });
  }

  function resolveSinewReference(reference) {
    var kind = reference.dataset.sinewReferenceKind;
    if (kind === "algorithm") {
      return document.getElementById(reference.dataset.sinewReferenceTarget || "");
    }

    var number = reference.dataset.sinewReferenceNumber;
    var identifier = (kind === "question" ? "Q" : "H") + number;
    var selector = '[data-sinew-statement-id="' + identifier + '"]';
    var stack = referenceStack(reference);
    var localTargets = stack ? Array.from(stack.querySelectorAll(selector)) : [];
    if (localTargets.length === 1) return localTargets[0];

    var globalTargets = Array.from(document.querySelectorAll(selector));
    return globalTargets.length === 1 ? globalTargets[0] : null;
  }

  function buildSinewReferencePreview(reference, target) {
    var kind = reference.dataset.sinewReferenceKind;
    var preview = document.createElement("div");
    preview.className = "sinew-reference-preview sinew-reference-preview-" + kind;

    if (kind === "algorithm") {
      var code = findAlgorithmCode(target);
      if (code) preview.appendChild(stripInspectorMetadata(code.cloneNode(true)));
      preview.appendChild(stripInspectorMetadata(target.cloneNode(true)));
      typesetClonedMath(preview);
      return preview;
    }

    var heading = document.createElement("p");
    heading.className = "sinew-reference-preview-label";
    heading.textContent = (kind === "question" ? "Research question " : "Research hypothesis ")
      + target.dataset.sinewStatementId;
    var statement = document.createElement("p");
    statement.className = "sinew-reference-preview-statement";
    statement.textContent = target.textContent.trim();
    preview.append(heading, statement);
    typesetClonedMath(preview);
    return preview;
  }

  function buildQuartoCrossReferencePreview(target) {
    var preview = document.createElement("div");
    preview.className = "sinew-reference-preview sinew-reference-preview-evidence";

    if (target.matches("img") || target.querySelector("figure.quarto-float-fig")) {
      preview.classList.add("sinew-reference-preview-figure");
      if (!target.matches("img")) {
        preview.appendChild(stripInspectorMetadata(target.cloneNode(true)));
        typesetClonedMath(preview);
        return preview;
      }
      var figure = document.createElement("figure");
      figure.appendChild(stripInspectorMetadata(target.cloneNode(true)));
      var caption = target.nextElementSibling;
      if (caption && caption.matches(".caption, figcaption")) {
        figure.appendChild(stripInspectorMetadata(caption.cloneNode(true)));
      }
      preview.appendChild(figure);
      typesetClonedMath(preview);
      return preview;
    }

    preview.classList.add("sinew-reference-preview-table");
    preview.appendChild(stripInspectorMetadata(target.cloneNode(true)));
    typesetClonedMath(preview);
    return preview;
  }

  function registerReferencePreview(reference, contentFactory, previewKind) {
    if (typeof window.tippy !== "function") return;
    var maxWidths = { table: 1100, figure: 900, algorithm: 900 };
    window.tippy(reference, {
      allowHTML: true,
      appendTo: function () {
        return reference.closest("section.slide") || reference.parentElement;
      },
      arrow: false,
      content: contentFactory,
      delay: 100,
      interactive: true,
      interactiveBorder: 10,
      maxWidth: maxWidths[previewKind] || 700,
      offset: [0, 0],
      onMount: function (instance) {
        typesetClonedMath(instance.popper);
      },
      placement: "bottom-start",
      theme: "light-border" + (previewKind ? " sinew-" + previewKind : "")
    });
  }

  function wireSinewReferences() {
    document.querySelectorAll("a.sinew-reference").forEach(function (reference) {
      var target = resolveSinewReference(reference);
      if (!target || !target.id) {
        reference.classList.add("is-unresolved");
        reference.setAttribute("aria-disabled", "true");
        reference.setAttribute("title", "Unresolved Sinew reference");
        return;
      }

      var kind = reference.dataset.sinewReferenceKind;
      var label = kind === "algorithm"
        ? evidenceIdentifier(target, "Algorithm")
        : target.dataset.sinewStatementId;
      reference.textContent = label;
      reference.setAttribute("href", "#/" + target.id);
      reference.setAttribute(
        "aria-label",
        "Open " + label + (kind === "algorithm" ? " at its source" : " at its original statement")
      );
      registerReferencePreview(reference, function () {
        return buildSinewReferencePreview(reference, target);
      }, kind);
    });

    document.querySelectorAll("a.quarto-xref").forEach(function (reference) {
      var href = reference.getAttribute("href") || "";
      var targetId = href.replace(/^#\/?/, "");
      var target = targetId ? document.getElementById(targetId) : null;
      if (!target) return;
      var previewKind = target.matches("img") || target.querySelector("figure.quarto-float-fig")
        ? "figure"
        : "table";
      registerReferencePreview(reference, function () {
        return buildQuartoCrossReferencePreview(target);
      }, previewKind);
    });
  }

  function stripInspectorMetadata(node) {
    if (!(node instanceof Element)) return node;

    node.classList.remove("sinew-expandable");
    node.removeAttribute("data-sinew-expandable");
    node.removeAttribute("data-sinew-click-expand");
    node.removeAttribute("tabindex");
    if (node.getAttribute("role") === "button") node.removeAttribute("role");
    node.removeAttribute("aria-label");
    node.removeAttribute("aria-haspopup");
    node.removeAttribute("aria-controls");
    node.querySelectorAll(".sinew-expand-control, .code-copy-button").forEach(function (control) {
      control.remove();
    });
    [node].concat(Array.from(node.querySelectorAll("[id]"))).forEach(function (element) {
      element.removeAttribute("id");
    });
    return node;
  }

  /* .plate (sinew-1dd.2) is a Pandoc image attribute, so Quarto attaches
     the class to the OUTER .quarto-float wrapper div, not to the <img>
     itself (verified against actual render output). cloneNode(true) on
     the expandable <figure> clones only <figure> and its descendants,
     never that outer wrapper, so a plated figure's fullscreen clone
     would otherwise silently lose its light backing -- reapply the
     class directly to the cloned media element, which core.scss also
     matches via img.plate/video.plate for exactly this case. */
  function mirrorPlateIntoClone(figure, clone) {
    var plateHost = figure.parentElement;
    if (!plateHost || !plateHost.classList.contains("plate")) return;
    var media = clone.querySelector("img, video");
    if (media) media.classList.add("plate");
  }

  function evidenceIdentifier(scope, fallback) {
    var identifier = scope.querySelector(".sinew-caption-identifier");
    return identifier ? identifier.textContent.trim() : fallback;
  }

  function buildEvidenceInspector() {
    var reveal = document.querySelector(".reveal");
    var slides = reveal ? reveal.querySelector(".slides") : null;
    if (!reveal || !slides || typeof HTMLDialogElement === "undefined") return;

    var dialog = document.createElement("dialog");
    dialog.id = "sinew-evidence-inspector";
    dialog.className = "sinew-fullscreen-dialog";
    dialog.setAttribute("aria-labelledby", "sinew-fullscreen-title");
    dialog.innerHTML = [
      '<div class="sinew-fullscreen-shell">',
      '  <div class="sinew-fullscreen-header">',
      '    <p class="sinew-fullscreen-title" id="sinew-fullscreen-title"></p>',
      '  </div>',
      '  <div class="sinew-fullscreen-content"></div>',
      '</div>'
    ].join("");
    reveal.appendChild(dialog);

    var title = dialog.querySelector(".sinew-fullscreen-title");
    var content = dialog.querySelector(".sinew-fullscreen-content");
    var returnFocus = null;

    function closeInspector() {
      if (dialog.open) dialog.close();
    }

    function openInspector(label, clone, opener, kind) {
      title.textContent = label;
      content.replaceChildren(stripInspectorMetadata(clone));
      typesetClonedMath(content);
      returnFocus = opener;
      dialog.dataset.sinewEvidenceKind = kind;
      dialog.showModal();
      if (kind === "figure") mirrorVideoStateIntoClone(opener, content);
    }

    dialog.addEventListener("cancel", function (event) {
      event.preventDefault();
      closeInspector();
    });
    dialog.addEventListener("click", function (event) {
      var clickClosesEvidence = event.target.closest(".sinew-fullscreen-content");
      if (event.target === dialog || clickClosesEvidence) closeInspector();
    });
    dialog.addEventListener("keydown", function (event) {
      event.stopPropagation();
    });
    dialog.addEventListener("close", function () {
      if (dialog.dataset.sinewEvidenceKind === "figure" && returnFocus) {
        mirrorVideoStateFromClone(content, returnFocus);
      }
      content.replaceChildren();
      delete dialog.dataset.sinewEvidenceKind;
      if (returnFocus && typeof returnFocus.focus === "function") returnFocus.focus();
      returnFocus = null;
    });

    function registerExpandable(target, kind, cloneFactory, explicitLabel) {
      if (!target || target.dataset.sinewExpandable === "true") return;

      var identifier = explicitLabel || evidenceIdentifier(target, kind);
      var accessibleLabel = "Open " + identifier + " fullscreen";

      target.dataset.sinewExpandable = "true";
      target.dataset.sinewClickExpand = "true";
      target.classList.add("sinew-expandable");
      target.setAttribute("tabindex", "0");
      target.setAttribute("role", "button");
      target.setAttribute("aria-label", accessibleLabel + "; press Escape or click the fullscreen evidence to close");
      target.setAttribute("aria-haspopup", "dialog");
      target.setAttribute("aria-controls", dialog.id);

      function activate() {
        openInspector(identifier, cloneFactory(), target, kind);
      }

      target.addEventListener("keydown", function (event) {
        if (event.key !== "Enter" && event.key !== " ") return;
        event.preventDefault();
        event.stopPropagation();
        activate();
      });
      target.addEventListener("click", function (event) {
        if (event.defaultPrevented || event.target.closest("a, button, video, audio")) return;
        activate();
      });
    }

    slides.querySelectorAll("section.slide figure").forEach(function (figure) {
      if (figure.querySelector("table")) return;
      registerExpandable(figure, "figure", function () {
        var clone = figure.cloneNode(true);
        mirrorPlateIntoClone(figure, clone);
        return clone;
      });
    });

    slides.querySelectorAll("section.slide table").forEach(function (table) {
      var target = table.closest(".structured-results") || table.closest(".quarto-float") || table.parentElement;
      registerExpandable(target, "table", function () {
        return target.cloneNode(true);
      });
    });

    slides.querySelectorAll("section.slide .algorithm-caption").forEach(function (caption) {
      var code = findAlgorithmCode(caption);
      if (!code) return;

      var label = evidenceIdentifier(caption, "algorithm");
      registerExpandable(code, "algorithm", function () {
        var algorithm = document.createElement("div");
        algorithm.className = "sinew-fullscreen-algorithm";
        algorithm.appendChild(code.cloneNode(true));
        algorithm.appendChild(caption.cloneNode(true));
        return algorithm;
      }, label);
    });
  }

  function enhanceDeck() {
    installInstitutionLockups();
    boldFloatIdentifiers();
    numberAlgorithmCaptions();
    labelMissingEvidence();
    buildStyleBibliographies();
    labelResearchStatements();
    buildEvidenceInspector();
    wireSinewReferences();
    manageVideoPlayback();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", enhanceDeck, { once: true });
  } else {
    enhanceDeck();
  }
})();
</script>
