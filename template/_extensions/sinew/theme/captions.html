<script>
(function () {
  function boldFloatIdentifiers() {
    document.querySelectorAll("figcaption.quarto-float-caption").forEach(function (caption) {
      if (caption.querySelector(".sinew-caption-identifier")) return;

      var textNode = Array.from(caption.childNodes).find(function (node) {
        return node.nodeType === Node.TEXT_NODE && /\S/.test(node.nodeValue || "");
      });
      if (!textNode) return;

      var match = textNode.nodeValue.match(/^(\s*)(Figure|Table)\s+([0-9]+(?:\.[0-9]+)*):\s*/);
      if (!match) return;

      var identifier = document.createElement("strong");
      identifier.className = "sinew-caption-identifier";
      identifier.textContent = match[2] + " " + match[3];

      caption.insertBefore(document.createTextNode(match[1]), textNode);
      caption.insertBefore(identifier, textNode);
      caption.insertBefore(document.createTextNode(": " + textNode.nodeValue.slice(match[0].length)), textNode);
      textNode.remove();
    });
  }

  function numberAlgorithmCaptions() {
    document.querySelectorAll(".algorithm-caption").forEach(function (caption, index) {
      var identifier = caption.querySelector("strong");
      if (!identifier) return;

      identifier.className = "sinew-caption-identifier";
      identifier.textContent = "Algorithm " + (index + 1);

      var suffix = identifier.nextSibling;
      if (suffix && suffix.nodeType === Node.TEXT_NODE && !/^\s*:/.test(suffix.nodeValue || "")) {
        suffix.nodeValue = ": " + (suffix.nodeValue || "").replace(/^\s+/, "");
      }
    });
  }

  function buildStyleBibliographies() {
    var globalReferences = document.querySelector(".global-references-slide #refs");
    if (!globalReferences) return;

    document.querySelectorAll(".style-references[data-reference-keys]").forEach(function (container) {
      var keys = (container.dataset.referenceKeys || "").trim().split(/\s+/).filter(Boolean);
      var allowedKeys = new Set(keys);

      container.classList.add("references", "csl-bib-body", "hanging-indent");
      container.setAttribute("role", "list");
      container.replaceChildren();

      keys.forEach(function (key) {
        var source = document.getElementById("ref-" + key);
        if (!source) return;

        var entry = source.cloneNode(true);
        entry.removeAttribute("id");
        entry.dataset.referenceKey = key;
        entry.setAttribute("role", "listitem");
        container.appendChild(entry);
      });

      var referencesSlide = container.closest("section.slide");
      var stack = referencesSlide ? referencesSlide.parentElement : null;
      if (!referencesSlide || !referencesSlide.id || !stack) return;

      stack.querySelectorAll('a[role="doc-biblioref"]').forEach(function (link) {
        var citation = link.closest("[data-cites]");
        var citedKeys = citation ? (citation.dataset.cites || "").split(/\s+/) : [];
        if (citedKeys.some(function (key) { return allowedKeys.has(key); })) {
          link.setAttribute("href", "#/" + referencesSlide.id);
        }
      });
    });
  }

  function labelResearchStatements() {
    [
      [".research-questions", "Q"],
      [".research-hypotheses", "H"]
    ].forEach(function (definition) {
      document.querySelectorAll(definition[0]).forEach(function (list) {
        Array.from(list.children).filter(function (item) {
          return item.matches("li");
        }).forEach(function (item, index) {
          var identifier = definition[1] + (index + 1);
          var slide = item.closest("section.slide");
          var scope = slide && slide.dataset.stylePreview
            ? slide.dataset.stylePreview
            : "deck";
          item.dataset.sinewStatementId = identifier;
          item.dataset.sinewStatementKind = definition[1] === "Q" ? "question" : "hypothesis";
          if (!item.id) item.id = "research-" + scope + "-" + identifier.toLowerCase();
          item.setAttribute("aria-label", identifier + ": " + item.textContent.trim());
        });
      });
    });
  }

  function referenceStack(element) {
    var slide = element.closest("section.slide");
    return slide ? slide.parentElement : null;
  }

  function findAlgorithmCode(caption) {
    var code = caption ? caption.previousElementSibling : null;
    while (code && !code.matches(".sourceCode, .code-copy-outer-scaffold, pre")) {
      code = code.previousElementSibling;
    }
    return code;
  }

  function resolveSinewReference(reference) {
    var kind = reference.dataset.sinewReferenceKind;
    if (kind === "algorithm") {
      return document.getElementById(reference.dataset.sinewReferenceTarget || "");
    }

    var number = reference.dataset.sinewReferenceNumber;
    var identifier = (kind === "question" ? "Q" : "H") + number;
    var selector = '[data-sinew-statement-id="' + identifier + '"]';
    var stack = referenceStack(reference);
    var localTargets = stack ? Array.from(stack.querySelectorAll(selector)) : [];
    if (localTargets.length === 1) return localTargets[0];

    var globalTargets = Array.from(document.querySelectorAll(selector));
    return globalTargets.length === 1 ? globalTargets[0] : null;
  }

  function buildSinewReferencePreview(reference, target) {
    var kind = reference.dataset.sinewReferenceKind;
    var preview = document.createElement("div");
    preview.className = "sinew-reference-preview sinew-reference-preview-" + kind;

    if (kind === "algorithm") {
      var code = findAlgorithmCode(target);
      if (code) preview.appendChild(stripInspectorMetadata(code.cloneNode(true)));
      preview.appendChild(stripInspectorMetadata(target.cloneNode(true)));
      return preview;
    }

    var heading = document.createElement("p");
    heading.className = "sinew-reference-preview-label";
    heading.textContent = (kind === "question" ? "Research question " : "Research hypothesis ")
      + target.dataset.sinewStatementId;
    var statement = document.createElement("p");
    statement.className = "sinew-reference-preview-statement";
    statement.textContent = target.textContent.trim();
    preview.append(heading, statement);
    return preview;
  }

  function buildQuartoCrossReferencePreview(target) {
    var preview = document.createElement("div");
    preview.className = "sinew-reference-preview sinew-reference-preview-evidence";

    if (target.matches("img") || target.querySelector("figure.quarto-float-fig")) {
      preview.classList.add("sinew-reference-preview-figure");
      if (!target.matches("img")) {
        preview.appendChild(stripInspectorMetadata(target.cloneNode(true)));
        return preview;
      }
      var figure = document.createElement("figure");
      figure.appendChild(stripInspectorMetadata(target.cloneNode(true)));
      var caption = target.nextElementSibling;
      if (caption && caption.matches(".caption, figcaption")) {
        figure.appendChild(stripInspectorMetadata(caption.cloneNode(true)));
      }
      preview.appendChild(figure);
      return preview;
    }

    preview.classList.add("sinew-reference-preview-table");
    preview.appendChild(stripInspectorMetadata(target.cloneNode(true)));
    return preview;
  }

  function registerReferencePreview(reference, contentFactory) {
    if (typeof window.tippy !== "function") return;
    window.tippy(reference, {
      allowHTML: true,
      appendTo: function () {
        return reference.closest("section.slide") || reference.parentElement;
      },
      arrow: false,
      content: contentFactory,
      delay: 100,
      interactive: true,
      interactiveBorder: 10,
      maxWidth: 700,
      offset: [0, 0],
      placement: "bottom-start",
      theme: "light-border"
    });
  }

  function wireSinewReferences() {
    document.querySelectorAll("a.sinew-reference").forEach(function (reference) {
      var target = resolveSinewReference(reference);
      if (!target || !target.id) {
        reference.classList.add("is-unresolved");
        reference.setAttribute("aria-disabled", "true");
        reference.setAttribute("title", "Unresolved Sinew reference");
        return;
      }

      var kind = reference.dataset.sinewReferenceKind;
      var label = kind === "algorithm"
        ? evidenceIdentifier(target, "Algorithm")
        : target.dataset.sinewStatementId;
      reference.textContent = label;
      reference.setAttribute("href", "#/" + target.id);
      reference.setAttribute(
        "aria-label",
        "Open " + label + (kind === "algorithm" ? " at its source" : " at its original statement")
      );
      registerReferencePreview(reference, function () {
        return buildSinewReferencePreview(reference, target);
      });
    });

    document.querySelectorAll("a.quarto-xref").forEach(function (reference) {
      var href = reference.getAttribute("href") || "";
      var targetId = href.replace(/^#\/?/, "");
      var target = targetId ? document.getElementById(targetId) : null;
      if (!target) return;
      registerReferencePreview(reference, function () {
        return buildQuartoCrossReferencePreview(target);
      });
    });
  }

  function stripInspectorMetadata(node) {
    if (!(node instanceof Element)) return node;

    node.classList.remove("sinew-expandable");
    node.removeAttribute("data-sinew-expandable");
    node.querySelectorAll(".sinew-expand-control, .code-copy-button").forEach(function (control) {
      control.remove();
    });
    [node].concat(Array.from(node.querySelectorAll("[id]"))).forEach(function (element) {
      element.removeAttribute("id");
    });
    return node;
  }

  function evidenceIdentifier(scope, fallback) {
    var identifier = scope.querySelector(".sinew-caption-identifier");
    return identifier ? identifier.textContent.trim() : fallback;
  }

  function buildEvidenceInspector() {
    var reveal = document.querySelector(".reveal");
    var slides = reveal ? reveal.querySelector(".slides") : null;
    if (!reveal || !slides || typeof HTMLDialogElement === "undefined") return;

    var dialog = document.createElement("dialog");
    dialog.id = "sinew-evidence-inspector";
    dialog.className = "sinew-fullscreen-dialog";
    dialog.setAttribute("aria-labelledby", "sinew-fullscreen-title");
    dialog.innerHTML = [
      '<div class="sinew-fullscreen-shell">',
      '  <div class="sinew-fullscreen-header">',
      '    <p class="sinew-fullscreen-title" id="sinew-fullscreen-title"></p>',
      '    <button class="sinew-fullscreen-close" type="button">Close</button>',
      '  </div>',
      '  <div class="sinew-fullscreen-content"></div>',
      '</div>'
    ].join("");
    reveal.appendChild(dialog);

    var title = dialog.querySelector(".sinew-fullscreen-title");
    var content = dialog.querySelector(".sinew-fullscreen-content");
    var closeButton = dialog.querySelector(".sinew-fullscreen-close");
    var returnFocus = null;

    function closeInspector() {
      if (dialog.open) dialog.close();
    }

    function openInspector(label, clone, opener) {
      title.textContent = label;
      content.replaceChildren(stripInspectorMetadata(clone));
      returnFocus = opener;
      dialog.showModal();
      closeButton.focus();
    }

    closeButton.addEventListener("click", closeInspector);
    dialog.addEventListener("cancel", function (event) {
      event.preventDefault();
      closeInspector();
    });
    dialog.addEventListener("click", function (event) {
      if (event.target === dialog) closeInspector();
    });
    dialog.addEventListener("keydown", function (event) {
      event.stopPropagation();
    });
    dialog.addEventListener("close", function () {
      content.replaceChildren();
      if (returnFocus && typeof returnFocus.focus === "function") returnFocus.focus();
      returnFocus = null;
    });

    function registerExpandable(target, kind, cloneFactory, explicitLabel, controlHost) {
      if (!target || target.dataset.sinewExpandable === "true") return;

      var identifier = explicitLabel || evidenceIdentifier(target, kind);
      var accessibleLabel = "Open " + identifier + " fullscreen";
      var control = document.createElement("button");
      control.type = "button";
      control.className = "sinew-expand-control";
      control.textContent = "Expand";
      control.setAttribute("aria-label", accessibleLabel);
      control.setAttribute("aria-haspopup", "dialog");
      control.setAttribute("aria-controls", dialog.id);

      target.dataset.sinewExpandable = "true";
      target.classList.add("sinew-expandable");
      if (controlHost && controlHost !== target) {
        control.classList.add("sinew-expand-control-inline");
        controlHost.appendChild(control);
      } else {
        target.appendChild(control);
      }

      function activate() {
        openInspector(identifier, cloneFactory(), control);
      }

      control.addEventListener("click", function (event) {
        event.preventDefault();
        event.stopPropagation();
        activate();
      });
      control.addEventListener("keydown", function (event) {
        if (event.key !== "Enter" && event.key !== " ") return;
        event.preventDefault();
        event.stopPropagation();
        activate();
      });
      target.addEventListener("click", function (event) {
        if (event.defaultPrevented || event.target.closest("a, button, video, audio")) return;
        activate();
      });
    }

    slides.querySelectorAll("section.slide figure").forEach(function (figure) {
      if (figure.querySelector("table")) return;
      registerExpandable(figure, "figure", function () {
        return figure.cloneNode(true);
      }, null, figure.querySelector("figcaption"));
    });

    slides.querySelectorAll("section.slide table").forEach(function (table) {
      var target = table.closest(".structured-results") || table.closest(".quarto-float") || table.parentElement;
      var tableCaption = target.querySelector("figcaption") || target.querySelector("caption");
      registerExpandable(target, "table", function () {
        return target.cloneNode(true);
      }, null, tableCaption);
    });

    slides.querySelectorAll("section.slide .algorithm-caption").forEach(function (caption) {
      var code = findAlgorithmCode(caption);
      if (!code) return;

      var label = evidenceIdentifier(caption, "algorithm");
      registerExpandable(code, "algorithm", function () {
        var algorithm = document.createElement("div");
        algorithm.className = "sinew-fullscreen-algorithm";
        algorithm.appendChild(code.cloneNode(true));
        algorithm.appendChild(caption.cloneNode(true));
        return algorithm;
      }, label, caption);
    });
  }

  function enhanceDeck() {
    boldFloatIdentifiers();
    numberAlgorithmCaptions();
    buildStyleBibliographies();
    labelResearchStatements();
    buildEvidenceInspector();
    wireSinewReferences();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", enhanceDeck, { once: true });
  } else {
    enhanceDeck();
  }
})();
</script>
