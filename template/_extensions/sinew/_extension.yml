title: Sinew Academic Reveal.js
author: Ivan Domrachev and contributors
version: 1.1.0-dev
quarto-required: ">=1.5.0"
contributes:
  formats:
    revealjs:
      theme:
        - default
        - theme/core.scss
      navigation-mode: grid
      controls: true
      controls-layout: edges
      controls-tutorial: true
      progress: true
      history: true
      hash: true
      transition: fade
      transition-speed: fast
      center: false
      center-title-slide: false
      slide-level: 2
      slide-number: h.v
      show-slide-number: all
      width: 1600
      height: 900
      margin: 0.07
      auto-stretch: false
      embed-resources: true
      fig-align: center
      fig-cap-location: bottom
      tbl-cap-location: top
      link-citations: true
      citations-hover: true
      link-external-newwindow: true
      code-overflow: wrap
      html-math-method: mathjax
      include-after-body:
        - theme/captions.html
